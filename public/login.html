<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Portal – Admin Login</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 0; }
    .wrap { max-width: 420px; margin: 10vh auto; padding: 24px; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,.08); background: var(--bg, #fff); }
    h1 { font-size: 1.25rem; margin: 0 0 12px; }
    p { margin: 0 0 16px; color: #555; }
    label { display: block; font-size: .9rem; margin: 12px 0 6px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
    button { margin-top: 16px; width: 100%; padding: 10px 12px; border: 0; border-radius: 8px; background: #1e88e5; color: #fff; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .error { margin-top: 12px; color: #b00020; }
    .muted { color: #777; font-size: .9rem; margin-top: 12px; }
    .center { text-align: center; }
    a { color: #1e88e5; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Admin Login</h1>
    <p>Enter your email and the shared access code to continue.</p>

    <form id="login-form" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required placeholder="you@example.com" />

      <label for="code">Access code</label>
      <input id="code" name="code" type="password" autocomplete="current-password" required placeholder="••••••••" />

      <button id="submit" type="submit">Sign in</button>
      <div id="error" class="error" role="alert" aria-live="polite"></div>
    </form>

    <p class="muted center"><a href="/">Back to portal</a></p>
  </div>

  <script src="/login.js" defer></script>
</body>
</html>
