<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Portal – Admin Login</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    :root { color-scheme: light; }
    body { font-family: var(--font-brand, system-ui); margin: 0; background: var(--background); color: var(--foreground); }
    .wrap { max-width: 420px; margin: 10vh auto; padding: 24px; border-radius: 12px; box-shadow: var(--shadow-md); background: var(--card); border: 1px solid var(--border); }
    h1 { font-size: 1.25rem; margin: 0 0 12px; font-weight: 700; }
    p { margin: 0 0 16px; color: var(--muted-foreground); }
    label { display: block; font-size: .9rem; margin: 12px 0 6px; color: var(--foreground); }
    input { width: 100%; padding: 10px 12px; border: 1px solid var(--input); border-radius: 8px; font-size: 1rem; background: var(--card); color: var(--foreground); }
    input:focus { outline: none; box-shadow: 0 0 0 2px var(--ring); border-color: var(--ring); }
    button { margin-top: 16px; width: 100%; padding: 10px 12px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-foreground); font-weight: 700; cursor: pointer; box-shadow: var(--shadow-sm); }
    button:hover { filter: brightness(0.98); }
    button:disabled { opacity: .6; cursor: default; }
    .error { margin-top: 12px; color: var(--destructive); }
    .muted { color: var(--muted-foreground); font-size: .9rem; margin-top: 12px; }
    .center { text-align: center; }
    .mb-4 { margin-bottom: 16px; }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="center mb-4">
      <img src="/logo.png" alt="Jones Engineering" style="width: 48px; height: 48px; border-radius: 8px; margin-bottom: 12px;">
    </div>
    <h1>Admin Login</h1>
    <p>Enter your email and the shared access code to continue.</p>

    <form id="login-form" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required placeholder="you@example.com" />

      <label for="code">Access code</label>
      <input id="code" name="code" type="password" autocomplete="current-password" required placeholder="••••••••" />

      <button id="submit" type="submit">Sign in</button>
      <div id="error" class="error" role="alert" aria-live="polite"></div>
    </form>

    <p class="muted center"><a href="/">Back to portal</a></p>
  </div>

  <script src="/login.js" defer></script>
</body>
</html>
