<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quality Portal — Documents</title>
  <link rel="stylesheet" href="/styles.css" />
  <meta name="description" content="Browse quality documents in this folder">
</head>
<body data-page="folder">
  <header class="header">
    <div class="container hero-landing">
      <div class="brand">
        <a href="/" aria-label="Back to folders" class="brand__logo-link">
          <img src="/logo.png" class="brand__logo" alt="Jones Engineering logo" />
        </a>
        <div>
          <h1 class="brand__title">Jones Engineering — Quality Portal</h1>
          <div class="rule" aria-hidden="true"></div>
          <p id="subtitle" class="subtitle">Loading folder...</p>
        </div>
        <div class="flex items-center gap-3" style="margin-left: auto;">
          <a href="/" class="btn btn--outline btn--sm">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 12H5"></path>
              <polyline points="12,19 5,12 12,5"></polyline>
            </svg>
            Back to Folders
          </a>
        </div>
      </div>
      <!-- Decorative brand motif (non-interactive) -->
      <div class="motif" aria-hidden="true">
        <div class="motif__grid">
          <div class="motif__diamond motif__diamond--g2" style="grid-column:2;grid-row:1"></div>
          <div class="motif__diamond motif__diamond--y"  style="grid-column:3;grid-row:2"></div>
          <div class="motif__diamond motif__diamond--g1" style="grid-column:4;grid-row:3"></div>
          <div class="motif__diamond motif__diamond--g3" style="grid-column:2;grid-row:3"></div>
          <div class="motif__diamond motif__diamond--g2" style="grid-column:3;grid-row:4"></div>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="mb-6">
      <div class="search">
        <input 
          id="search" 
          class="input" 
          type="search" 
          placeholder="Search documents in this folder..." 
          aria-label="Search documents"
        />
        <span id="badge" class="badge" style="display:none"></span>
      </div>
    </section>

    <section>
      <div id="list" class="list" aria-live="polite" role="region" aria-label="Document list">
        <!-- Loading skeletons -->
        <li class="skeleton" style="height:60px" aria-hidden="true"></li>
        <li class="skeleton" style="height:60px" aria-hidden="true"></li>
        <li class="skeleton" style="height:60px" aria-hidden="true"></li>
        <li class="skeleton" style="height:60px" aria-hidden="true"></li>
      </div>

      <div id="empty" class="text-center py-12" style="display:none">
        <div class="text-muted mb-4">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mx-auto opacity-50">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14,2 14,8 20,8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10,9 9,9 8,9"></polyline>
          </svg>
        </div>
        <h3 class="text-lg font-semibold mb-2">No documents found</h3>
        <p class="text-muted mb-4">This folder doesn't contain any documents yet.</p>
        <a href="/admin" class="btn btn--outline">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Add Documents
        </a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2025 Jones Engineering</p>
  </footer>
  
  <script src="/ui.js"></script>
</body>
</html>
