<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quality Portal — Folders</title>
  <link rel="stylesheet" href="/styles.css" />
  <meta name="description" content="Access quality control documents and procedures through QR codes">
</head>
<body data-page="folders">
  <header class="header">
    <div class="container">
      <div class="brand">
        <img src="/logo.png" class="brand__logo" alt="Jones Engineering logo" />
        <div>
          <h1 class="brand__title">Jones Engineering — Quality Portal</h1>
          <p class="subtitle">Access critical quality documents instantly</p>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="mb-8">
      <div class="search">
        <input 
          id="search" 
          class="input" 
          type="search" 
          placeholder="Search quality folders..." 
          aria-label="Search folders"
        />
      </div>
    </section>

    <section>
      <div id="grid" class="grid" aria-live="polite" role="region" aria-label="Quality folders">
        <!-- Loading skeletons -->
        <div class="card skeleton" style="height:120px" aria-hidden="true"></div>
        <div class="card skeleton" style="height:120px" aria-hidden="true"></div>
        <div class="card skeleton" style="height:120px" aria-hidden="true"></div>
        <div class="card skeleton" style="height:120px" aria-hidden="true"></div>
      </div>

      <div id="empty" class="text-center py-12" style="display:none">
        <div class="text-muted mb-4">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mx-auto">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14,2 14,8 20,8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10,9 9,9 8,9"></polyline>
          </svg>
        </div>
        <h3 class="text-lg font-semibold mb-2">No folders found</h3>
        <p class="text-muted">Try adjusting your search or contact your administrator.</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2025 Jones Engineering</p>
  </footer>
  
  <script src="/ui.js"></script>
</body>
</html>
